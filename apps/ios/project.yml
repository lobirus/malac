# The Xcode project is generated from this file: `xcodegen generate`.
name: Malac
options:
  bundleIdPrefix: io.malac
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Your Apple team, to run on a phone: set it here or in Xcode's Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
packages:
  MalacKit:
    path: MalacKit
targets:
  Malac:
    type: application
    platform: iOS
    sources:
      - path: Malac
        excludes:
          - Info.plist
    dependencies:
      - package: MalacKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.malac.app
        PRODUCT_NAME: Malac
        INFOPLIST_FILE: Malac/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: malac
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the pairing code that `malac remote pair` shows.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Dictate prompts and talk with malac. Recordings go to your daemon, which sends them to the voice model you chose.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save images malac sends you, such as screenshots, to your photo library.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
schemes:
  Malac:
    build:
      targets:
        Malac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: MalacKit/MalacKitTests
    archive:
      config: Release
