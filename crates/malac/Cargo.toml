[package]
name = "malac"
description = "Multi-Agent Loop for Autonomous Coding: an AI coding agent for the terminal, the browser and your editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "malac"
path = "src/main.rs"
doc = false

[dependencies]
malac-core.workspace = true

anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
crossterm = { workspace = true, features = ["event-stream"] }
dirs.workspace = true
futures.workspace = true
ignore.workspace = true
malac-mcp.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
reqwest.workspace = true
rustyline = "15"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation = "1"
unicode-width = "0.2"
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The microphone and speaker on macOS. Elsewhere malac uses the sound
# system's commands, so the binary needs no audio library to start.
[target.'cfg(target_os = "macos")'.dependencies]
cpal = { version = "0.18", default-features = false }

[dev-dependencies]
tempfile = "3"
